name: admin-hygiene-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-hygiene-patch.yml'
      - 'scripts/patch-admin-hygiene.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical admin hygiene patch
        run: |
          python3 scripts/patch-admin-hygiene.py
          wc -c server/index.js
          wc -l server/index.js
          grep -n "Only CQ_ADMIN_EMAIL" server/index.js
          ! grep -n "adminEmail: ADMIN_EMAIL" server/index.js
          ! grep -n "admin@computerquest.app" server/index.js
      - name: Commit
        run: |
          git config user.name "cq-hygiene"
          git config user.email "cq-hygiene@users.noreply.github.com"
          git add server/index.js
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "security(admin): ensureAdmin only CQ_ADMIN_EMAIL; hide adminEmail on /api/health"
            git push
          fi
