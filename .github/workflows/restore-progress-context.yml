name: restore-progress-context
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/pc-restore/**'
      - '.github/workflows/restore-progress-context.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ProgressContext.jsx from base64 parts
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('scripts/pc-restore').glob('part*.b64'))
          assert parts, 'no parts'
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          text = data.decode()
          assert len(data) > 15000
          assert 'streakReconciledRef' in text
          assert 'PLACEHOLDER' not in text
          assert 'toISOString' not in text
          Path('src/context/ProgressContext.jsx').write_bytes(data)
          print('RESTORED', len(data))
          PY
      - name: Commit
        run: |
          git config user.name cq-streak-fix
          git config user.email cq-streak-fix@users.noreply.github.com
          git add src/context/ProgressContext.jsx
          if git diff --staged --quiet; then
            echo No change
          else
            wc -c src/context/ProgressContext.jsx
            git commit -m "fix(streak): restore full ProgressContext with hydrate-safe local-day streak"
            git push
          fi
