name: restore-progress-context
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_streak_fix.py'
      - '.github/workflows/restore-progress-context.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical streak fix to ProgressContext
        run: |
          python3 scripts/apply_streak_fix.py
          test -f src/context/ProgressContext.jsx
          wc -c src/context/ProgressContext.jsx
          grep -n streakReconciledRef src/context/ProgressContext.jsx
          ! grep -n toISOString src/context/ProgressContext.jsx
          ! grep -n PLACEHOLDER src/context/ProgressContext.jsx
      - name: Commit
        run: |
          git config user.name cq-streak-fix
          git config user.email cq-streak-fix@users.noreply.github.com
          git add src/context/ProgressContext.jsx
          if git diff --staged --quiet; then
            echo No change
          else
            git commit -m "fix(streak): hydrate-safe local calendar-day streak in ProgressContext"
            git push
          fi
